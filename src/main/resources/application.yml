server:
  port: ${PORT:8080}

spring:
  application:
    name: onze-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/onze}
    username: ${DATABASE_USERNAME:onze}
    password: ${DATABASE_PASSWORD:onze}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
