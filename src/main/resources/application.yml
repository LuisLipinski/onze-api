server:
  port: ${PORT:8080}

spring:
  application:
    name: onze-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/onze}
    username: ${DATABASE_USERNAME:onze}
    password: ${DATABASE_PASSWORD:onze}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

security:
  jwt:
    issuer: ${JWT_ISSUER:onze-api}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
