server:
  port: ${PORT:8080}

spring:
  application:
    name: onze-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/onze}
    username: ${DATABASE_USERNAME:onze}
    password: ${DATABASE_PASSWORD:onze}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  public-base-url: ${PUBLIC_BASE_URL:https://onze-organizador-de-pelada.onrender.com}

security:
  jwt:
    issuer: ${JWT_ISSUER:onze-api}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}

email:
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:}

media:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
